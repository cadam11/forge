name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
      - 'vitest.config.ts'
  push:
    branches: [main]

jobs:
  test:
    name: Type-check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads the version from the root package.json "packageManager" field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @joinery/shared exec tsc --build

      - name: Type-check main
        run: pnpm exec tsc --noEmit -p packages/main/tsconfig.json

      - name: Type-check renderer
        run: pnpm exec tsc --noEmit -p packages/renderer/tsconfig.json

      - name: Type-check renderer-react
        run: pnpm exec tsc --noEmit -p packages/renderer-react/tsconfig.json

      - name: Type-check preload
        run: pnpm exec tsc --noEmit -p packages/preload/tsconfig.json

      # Scoped to renderer-react on purpose. Root `pnpm run lint` (turbo) is red on
      # main because packages/renderer declares `ng lint` with no Angular lint target
      # (plans/rebrand/FOLLOW-UPS.md items 6 and 14), so it cannot gate CI. Without
      # this step nothing enforces react-hooks / jsx-a11y for the whole rewrite.
      # Widen to the root script once that target is fixed or removed.
      - name: Lint renderer-react
        run: pnpm --filter @joinery/renderer-react run lint

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
