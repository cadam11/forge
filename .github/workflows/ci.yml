name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
      - 'tests/**'
      - 'vitest.config.ts'
      - 'tsconfig.tests.json'
      - 'playwright.config.ts'
  push:
    branches: [main]

jobs:
  test:
    name: Type-check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads the version from the root package.json "packageManager" field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @joinery/shared exec tsc --build

      # Same reason as the step above: dist/ is gitignored, so on a clean checkout there
      # are no declarations to type-check against. packages/renderer imports
      # `JoineryAPI` from @joinery/preload, which resolves via the package's
      # "types": "dist/index.d.ts" — absent here until something emits it. The
      # "Type-check preload" step below cannot serve: it is --noEmit, and it runs after.
      # Must follow the shared build, because preload's declaration emit is a composite
      # project referencing packages/shared.
      - name: Build preload package
        run: pnpm --filter @joinery/preload run build

      - name: Type-check main
        run: pnpm exec tsc --noEmit -p packages/main/tsconfig.json

      - name: Type-check renderer
        run: pnpm exec tsc --noEmit -p packages/renderer/tsconfig.json

      - name: Type-check preload
        run: pnpm exec tsc --noEmit -p packages/preload/tsconfig.json

      - name: Type-check tests
        run: pnpm run typecheck:tests

      # Scoped to the renderer on purpose. Root `pnpm run lint` (turbo) covers only the
      # packages that declare a `lint` task, and today that is this one — main, preload,
      # shared and cli have none (plans/rebrand/FOLLOW-UPS.md items 6 and 14). Widen to
      # the root script once they do.
      - name: Lint renderer
        run: pnpm --filter @joinery/renderer run lint

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
