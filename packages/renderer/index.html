<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <title>Joinery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Ink-first: dark is listed first so the UA picks it when nothing else has
         resolved yet. src/styles/theme.css then sets `color-scheme` per theme, which
         is what native scrollbars and form controls follow. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#171817" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2efe7" media="(prefers-color-scheme: light)" />

    <script>
      /* Pre-mount theme resolution. The audit (PROPOSAL §1.6) documented a three-stage
         flash — white, then dark, then light — because the Angular renderer only writes
         data-theme after it bootstraps (settings.service.ts:227-229). Writing it here,
         synchronously, before the bundle is even requested, is the fix.

         Task 5 moved settings into main-process AppState, which is reachable only over
         async IPC — no use at all to a <head> script. So the settings store mirrors the
         theme preference, and nothing else, into one small React-owned localStorage key.
         This reader is the mirror's only consumer, with the Angular settings object as a
         fallback so a user whose migration has not run yet still gets their real theme.

         Deliberately duplicated from src/persistence/theme-mirror.ts: that module cannot
         run before the bundle loads, which is the entire point of this script. Keep the
         two in step — the mirror module documents the whole decision. */
      (function () {
        var isPreference = function (value) {
          return value === 'system' || value === 'light' || value === 'dark';
        };
        var read = function (key) {
          try {
            return window.localStorage.getItem(key);
          } catch (error) {
            /* Storage blocked outright. Not fatal — 'system' is a correct answer — but
               never silent. */
            console.warn('[joinery] could not read localStorage key ' + key + ':', error);
            return null;
          }
        };

        var preference = 'system';
        var mirrored = read('joinery:theme-preference');
        if (isPreference(mirrored)) {
          preference = mirrored;
        } else {
          var raw = read('joinery-settings');
          try {
            var stored = raw ? JSON.parse(raw).theme : null;
            if (isPreference(stored)) {
              preference = stored;
            } else if (stored != null) {
              console.warn('[joinery] ignoring unrecognised persisted theme:', stored);
            }
          } catch (error) {
            console.warn('[joinery] could not parse the persisted settings:', error);
          }
        }
        document.documentElement.setAttribute('data-theme', preference);
      })();
    </script>

    <style>
      /* Critical canvas. Covers the one window the script above cannot: HTML parsed,
         data-theme set, stylesheet not yet applied. Four hexes duplicated from
         theme.css on purpose — they are --color-canvas/--color-fg for both themes and
         theme.css re-declares them as tokens immediately after. */
      html {
        background-color: #171817;
        color: #f2efe7;
      }
      html[data-theme='light'] {
        background-color: #f2efe7;
        color: #171817;
      }
      @media (prefers-color-scheme: light) {
        html[data-theme='system'] {
          background-color: #f2efe7;
          color: #171817;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
